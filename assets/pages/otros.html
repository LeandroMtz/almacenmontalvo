<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/png" href="../logo.png">

<title>Otros · Almacén Montalvo</title>
<style>
  :root{
    --navy:#1B2B4A;
    --navy-dark:#0f1a2e;
    --gold:#D4AF37;
    --gold-light:#E5C95A;
    --white:#FFFFFF;
    --silver:#C8C8C8;
    --cream:#F5F3E8;
    --beige:#E8DCC4;
    --text-dark:#1B2B4A;
    --text-light:#6B6B6B;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Helvetica Neue',Arial,sans-serif;
    background:var(--cream);
    color:var(--text-dark);
    line-height:1.6;
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.5px}

  /* TOP NAVIGATION */
  .top-nav{
    background:var(--navy);
    padding:0.8rem 1.5rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    gap:1rem;
  }
  .nav-left{display:flex;align-items:center;gap:0.8rem;min-width:0}
  .logo-container{display:flex;align-items:center;gap:0.8rem;text-decoration:none;flex-shrink:0}
  .logo-img{height:40px;width:auto}
  .logo-text{font-family:Georgia,serif;font-size:1.2rem;color:var(--white);letter-spacing:1px;white-space:nowrap}
  .btn-home{
    background:transparent;color:var(--gold);border:2px solid var(--gold);
    padding:0.45rem 1rem;font-size:0.78rem;font-weight:600;
    text-transform:uppercase;letter-spacing:1px;
    border-radius:4px;transition:all .3s;text-decoration:none;
    display:inline-flex;align-items:center;gap:0.4rem;white-space:nowrap;
    flex-shrink:0;
  }
  .btn-home:hover{background:var(--gold);color:var(--navy);transform:translateY(-2px)}
  .btn-home svg{width:14px;height:14px;fill:currentColor}
  .social-buttons{display:flex;gap:0.8rem}
  .btn-social{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;transition:all .3s;border:2px solid var(--gold);
    flex-shrink:0;
  }
  .btn-social svg{width:20px;height:20px;fill:var(--gold)}
  .btn-social:hover{background:var(--gold);transform:translateY(-2px)}
  .btn-social:hover svg{fill:var(--navy)}
  .btn-whatsapp-social{background:#25D366;border-color:#25D366}
  .btn-whatsapp-social svg{fill:var(--white)}
  .btn-whatsapp-social:hover{background:#128C7E}
  .btn-facebook:hover{background:#1877F2;border-color:#1877F2}
  .btn-facebook:hover svg{fill:var(--white)}

  /* BOTTOM NAVIGATION */
  .bottom-nav{
    background:var(--navy);padding:0.7rem 1.5rem;
    display:flex;align-items:center;
    border-top:1px solid rgba(212,175,55,.3);
  }
  .nav-highlights{display:flex;gap:0.8rem;width:100%}
  .btn-highlight{
    background:transparent;color:var(--gold);border:2px solid var(--gold);
    padding:0.5rem 1.2rem;font-size:0.85rem;font-weight:600;
    text-transform:uppercase;letter-spacing:1px;cursor:pointer;
    border-radius:4px;transition:all .3s;text-decoration:none;
    display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;
    white-space:nowrap;flex:1;
  }
  .btn-highlight:hover{background:var(--gold);color:var(--navy);transform:translateY(-2px)}
  .btn-highlight.gold{background:var(--gold);color:var(--navy)}
  .btn-highlight.gold:hover{background:var(--gold-light)}
  .categories-dropdown{position:relative;flex:1;display:flex}
  .categories-dropdown .btn-highlight{width:100%}
  .dropdown-menu{
    position:absolute;top:calc(100% + 0.5rem);left:0;
    background:var(--white);min-width:220px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    border-radius:4px;
    opacity:0;visibility:hidden;transform:translateY(-8px);
    transition:all .3s;z-index:1001;
  }
  .dropdown-menu.active{opacity:1;visibility:visible;transform:translateY(0)}
  .dropdown-menu a{
    display:block;padding:0.9rem 1.2rem;color:var(--text-dark);
    text-decoration:none;border-bottom:1px solid var(--cream);
    transition:all .3s;font-size:0.85rem;
  }
  .dropdown-menu a:hover{background:var(--navy);color:var(--gold)}
  .dropdown-menu a:last-child{border-bottom:none}
  .dropdown-menu a.current{background:var(--navy);color:var(--gold);font-weight:600}

  /* CATEGORY HEADER */
  .category-header{
    background:linear-gradient(135deg, var(--navy) 0%, #2d3f5f 100%);
    color:var(--white);
    padding:1.5rem 1.5rem;
    text-align:center;
    border-bottom:2px solid var(--gold);
  }
  .category-header p{
    font-size:0.95rem;
    opacity:0.95;
    max-width:800px;
    margin:0 auto;
    line-height:1.5;
  }

  /* PRODUCTS GRID */
  .container{
    max-width:1400px;
    margin:0 auto;
    padding:2rem 1.5rem;
  }
  .products-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:1.5rem;
  }

  /* PRODUCT CARD */
  .product-card{
    background:var(--white);
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    transition:all .3s;
    display:flex;
    flex-direction:column;
    border:1px solid var(--silver);
  }
  .product-card:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 25px rgba(27,43,74,0.12);
    border-color:var(--gold);
  }
  .product-image{
    width:100%;
    aspect-ratio:1;
    background:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .4s;
  }
  .product-card:hover .product-image img{
    transform:scale(1.05);
  }
  .product-image .fallback-icon{
    display:none;
    width:50%;
    height:50%;
    color:var(--navy);
  }
  .product-image img.error + .fallback-icon{
    display:block;
  }
  .product-image img.error{
    display:none;
  }
  .stock-badge{
    position:absolute;
    top:10px;
    left:10px;
    padding:0.3rem 0.7rem;
    border-radius:3px;
    font-size:0.65rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:1px;
    z-index:2;
  }
  .stock-badge.in-stock{
    background:var(--gold);
    color:var(--navy);
  }
  .stock-badge.out-stock{
    background:var(--silver);
    color:var(--navy);
  }
  .product-info{
    padding:1.2rem;
    flex-grow:1;
    display:flex;
    flex-direction:column;
  }
  .product-category{
    font-size:0.65rem;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-bottom:0.4rem;
    font-weight:600;
  }
  .product-name{
    font-family:Georgia,serif;
    font-size:1.05rem;
    color:var(--navy);
    margin-bottom:0.6rem;
    font-weight:400;
    line-height:1.3;
  }
  .product-price{
    font-size:1.5rem;
    color:var(--gold);
    font-weight:700;
    margin-bottom:0.8rem;
    font-family:Georgia,serif;
  }
  .product-price .old-price{
    font-size:0.9rem;
    color:var(--silver);
    text-decoration:line-through;
    margin-left:0.5rem;
    font-weight:400;
  }
  .btn-view-more{
    background:transparent;
    border:1.5px solid var(--navy);
    color:var(--navy);
    padding:0.5rem;
    cursor:pointer;
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:600;
    border-radius:3px;
    transition:all .3s;
    margin-bottom:0.8rem;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .btn-view-more:hover{
    background:var(--navy);
    color:var(--gold);
  }
  .product-description{
    max-height:0;
    overflow:hidden;
    transition:max-height .4s ease, opacity .3s ease, padding .3s ease;
    background:var(--cream);
    padding:0 0.8rem;
    border-radius:3px;
    margin-bottom:0;
    font-size:0.8rem;
    color:var(--text-light);
    line-height:1.5;
    opacity:0;
  }
  .product-description.show{
    max-height:250px;
    padding:0.8rem;
    margin-bottom:0.8rem;
    opacity:1;
  }
  .btn-whatsapp{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.5rem;
    background:var(--navy);
    color:var(--white);
    text-decoration:none;
    padding:0.7rem;
    border-radius:3px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:1px;
    font-size:0.75rem;
    transition:all .3s;
    margin-top:auto;
    border:1.5px solid var(--navy);
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .btn-whatsapp:hover{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--navy);
  }
  .btn-whatsapp svg{
    width:16px;
    height:16px;
    fill:currentColor;
  }
  .btn-whatsapp.disabled{
    background:var(--silver);
    border-color:var(--silver);
    color:var(--navy);
    cursor:not-allowed;
    pointer-events:none;
  }

  /* FOOTER (2 líneas) */
  footer{
    background:var(--navy);
    color:var(--white);
    padding:2rem 1.5rem;
    text-align:center;
    margin-top:3rem;
  }
  footer p{
    color:var(--silver);
    font-size:0.85rem;
  }
  .footer-main{
    margin-bottom:0.35rem;
  }
  .footer-sub{
    font-size:0.8rem;
  }
  .credit-wrap{
    white-space:nowrap;
  }
  .dev-credit{
    color:#FF6B00;
    font-weight:700;
    letter-spacing:1px;
    transition:all .3s;
    text-decoration:none;
  }
  .dev-credit:hover{
    color:#FF8C3A;
    text-shadow:0 0 8px rgba(255,107,0,0.4);
  }

  /* RESPONSIVE */
  @media(max-width:768px){
    .top-nav{padding:0.6rem 0.8rem;gap:0.6rem}
    .nav-left{gap:0.6rem}
    .logo-img{height:30px}
    .logo-text{font-size:0.85rem}
    .btn-home{padding:0.4rem 0.7rem;font-size:0.62rem;gap:0.3rem;border-width:1.5px}
    .btn-home svg{width:11px;height:11px}
    .social-buttons{gap:0.4rem}
    .btn-social{width:32px;height:32px;border-width:1.5px}
    .btn-social svg{width:15px;height:15px}

    .bottom-nav{padding:0.5rem 0.8rem}
    .nav-highlights{gap:0.5rem}
    .btn-highlight{font-size:0.6rem;padding:0.45rem 0.4rem;letter-spacing:0.5px;gap:0.3rem;border-width:1.5px}
    .btn-highlight svg{width:12px;height:12px}
    .dropdown-menu{min-width:200px}
    .dropdown-menu a{padding:0.7rem 1rem;font-size:0.8rem}

    .category-header{padding:1.2rem 1rem}
    .category-header p{font-size:0.85rem}

    .products-grid{
      grid-template-columns:repeat(2, 1fr);
      gap:1rem;
    }
    .product-info{padding:1rem}
    .product-name{font-size:0.95rem}
    .product-price{font-size:1.3rem}
  }

  @media(max-width:480px){
    .logo-img{height:26px}
    .logo-text{font-size:0.78rem}
    .btn-home{padding:0.35rem 0.55rem;font-size:0.58rem}
    .btn-social{width:28px;height:28px}
    .btn-social svg{width:13px;height:13px}
    .btn-highlight{font-size:0.55rem;padding:0.4rem 0.3rem}

    .category-header{padding:1rem}
    .category-header p{font-size:0.8rem}

    .container{padding:1rem 0.8rem}
    .products-grid{
      grid-template-columns:repeat(2, 1fr);
      gap:0.8rem;
    }
    .product-card{border-radius:4px}
    .product-info{padding:0.8rem}
    .product-category{font-size:0.6rem}
    .product-name{font-size:0.85rem;margin-bottom:0.5rem}
    .product-price{font-size:1.15rem;margin-bottom:0.6rem}
    .btn-view-more{padding:0.4rem;font-size:0.7rem;margin-bottom:0.6rem}
    .product-description{font-size:0.75rem}
    .product-description.show{padding:0.6rem;margin-bottom:0.6rem}
    .btn-whatsapp{padding:0.6rem;font-size:0.7rem}
    .stock-badge{font-size:0.6rem;padding:0.25rem 0.6rem}
  }
</style>
</head>

    speaker:'<rect x="30" y="25" width="40" height="50" rx="4"/><circle cx="50" cy="40" r="7"/><circle cx="50" cy="60" r="10"/>',
    breaker:'<rect x="35" y="30" width="30" height="40" rx="4"/><line x1="50" y1="40" x2="50" y2="52"/><circle cx="50" cy="58" r="3"/><line x1="50" y1="22" x2="50" y2="30"/><line x1="50" y1="70" x2="50" y2="78"/>',
    protector:'<rect x="30" y="30" width="40" height="40" rx="4"/><path d="M52 38 L44 52 L50 52 L48 62 L56 48 L50 48 Z"/><line x1="38" y1="70" x2="38" y2="78"/><line x1="62" y1="70" x2="62" y2="78"/>',
    extinguisher:'<rect x="40" y="35" width="20" height="38" rx="5"/><line x1="50" y1="35" x2="50" y2="28"/><path d="M50 28 L62 24"/><rect x="45" y="28" width="10" height="7" rx="2"/>',
    led:'<circle cx="50" cy="45" r="15"/><line x1="50" y1="60" x2="50" y2="68"/><line x1="35" y1="70" x2="65" y2="70"/><path d="M42 38 Q50 32 58 38"/>',
    fanStand:'<circle cx="50" cy="35" r="14"/><circle cx="50" cy="35" r="3"/><line x1="50" y1="49" x2="50" y2="70"/><line x1="38" y1="75" x2="62" y2="75"/>'
  };

  const phone = '5491100000000';
  const grid = document.getElementById('productsGrid');

  function renderProducts(){
    grid.innerHTML = products.map(p => {
      const msg = encodeURIComponent(`Hola! Me interesa: ${p.name} ($${p.price})`);
      const oldPriceHtml = p.oldPrice ? `<span class="old-price">$${p.oldPrice}</span>` : '';
      const descHtml = p.description ? `
            <button class="btn-view-more" onclick="toggleDescription(${p.id}, this)">Ver Más</button>
            <div class="product-description" id="desc-${p.id}">${p.description}</div>` : '';

      return `
        <div class="product-card">
          <div class="product-image">
            <span class="stock-badge ${p.stock ? 'in-stock' : 'out-stock'}">
              ${p.stock ? '✓ En stock' : '✗ Sin stock'}
            </span>
            <img src="${p.image}" alt="${p.name}" onerror="this.classList.add('error')">
            <svg class="fallback-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
              ${icons[p.icon] || icons.tv}
            </svg>
          </div>
          <div class="product-info">
            <div class="product-category">${p.category}</div>
            <h3 class="product-name">${p.name}</h3>
            <div class="product-price">$${p.price}${oldPriceHtml}</div>
            ${descHtml}
            <a href="${p.stock ? `https://wa.me/${phone}?text=${msg}` : '#'}" 
               target="${p.stock ? '_blank' : '_self'}" 
               class="btn-whatsapp ${p.stock ? '' : 'disabled'}">
              <svg viewBox="0 0 24 24"><path d="M20 3.5A11 11 0 003.5 18L2 22l4-1.5A11 11 0 1020 3.5zM12 20a8 8 0 01-4-1l-3 1 1-3a8 8 0 1111 3z"/></svg>
              ${p.stock ? 'Pedir' : 'Sin stock'}
            </a>
          </div>
        </div>
      `;
    }).join('');
  }

  function toggleDescription(productId, btn){
    const desc = document.getElementById(`desc-${productId}`);
    document.querySelectorAll('.product-description').forEach(d => {
      if(d.id !== `desc-${productId}`) d.classList.remove('show');
    });
    document.querySelectorAll('.btn-view-more').forEach(b => {
      if(b !== btn) b.textContent = 'Ver Más';
    });
    if(desc.classList.contains('show')){
      desc.classList.remove('show');
      btn.textContent = 'Ver Más';
    } else {
      desc.classList.add('show');
      btn.textContent = 'Cerrar';
    }
  }

  renderProducts();
</script>
</body>
</html>
